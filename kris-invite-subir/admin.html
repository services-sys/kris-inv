<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Respuestas de Kristel 🐄</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .card { background: var(--paper); color: var(--ink); border: var(--px) solid var(--line); box-shadow: 0 0 0 var(--px) var(--pink-l); padding: 16px; }
    .card h1 { font-family: "Press Start 2P", monospace; font-size: 13px; color: var(--pink); margin: 0 0 14px; line-height: 1.5; }
    dl { margin: 0; display: grid; gap: 10px; }
    dt { font-family: "Press Start 2P", monospace; font-size: 9px; color: #7a6a8a; text-transform: uppercase; }
    dd { margin: 2px 0 0; font-size: 26px; line-height: 1.05; overflow-wrap: anywhere; }
    .msg { white-space: pre-wrap; background: #fff; border: 3px dashed var(--pink-l); padding: 8px; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    .row .btn { flex: 1; }
    .muted { font-size: 20px; color: #7a6a8a; }
    .cop { color: #d22; }
  </style>
</head>
<body>
  <main class="game">
    <header class="hud"><span class="hud-title">🐄 Panel de Bernal</span><span id="demo" class="demo" hidden>DEMO</span></header>
    <section class="card" id="out"><p class="muted">Cargando…</p></section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
