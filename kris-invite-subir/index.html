<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Una misión para Kristel 💌</title>
  <meta name="description" content="Una invitación muy importante te espera.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a1640">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="game">
    <header class="hud">
      <span class="hud-title">💌 Para: Kristel</span>
      <span id="demo" class="demo" hidden>DEMO</span>
      <button id="mute" class="icon-btn" aria-label="Silenciar sonido" aria-pressed="false">🔊</button>
    </header>

    <div class="stage" id="stage">
      <canvas id="screen" width="160" height="120" aria-label="Escena del juego"></canvas>
      <div id="bubbles" aria-hidden="true"></div>
    </div>

    <section class="dialog" id="dialog" aria-live="polite">
      <p id="speaker" class="speaker" hidden></p>
      <p id="text" class="text"></p>
      <div id="choices" class="choices"></div>
    </section>

    <footer class="foot">De parte de Bernal ✨ hecho con pixeles y cariño</footer>
  </main>

  <div id="letter" class="letter" hidden>
    <div class="paper" role="dialog" aria-modal="true" aria-label="Carta de Bernal">
      <div class="seal">💌</div>
      <div id="letter-body"></div>
      <p id="letter-status" class="status"></p>
      <button id="letter-ok" class="btn primary">💖 ¡Es una cita!</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
