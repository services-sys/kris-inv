<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mensaje expirado ⏳</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a1640">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dialog { min-height: 0; }
    .text { min-height: 0; }
    .stage { cursor: pointer; }
  </style>
</head>
<body>
  <main class="game">
    <header class="hud">
      <span class="hud-title">💌 Correo vaquero</span>
    </header>

    <div class="stage" id="stage">
      <canvas id="screen" width="160" height="120" aria-label="Una vaquita mensajera flaquita intenta despegar con una carta, pero tiene demasiada hambre"></canvas>
      <div id="bubbles" aria-hidden="true"></div>
    </div>

    <section class="dialog">
      <p class="speaker">⏳ Mensaje expirado</p>
      <p class="text">La vaquita mensajera tiene demasiada hambre para poder llevar tu mensaje.</p>
    </section>
  </main>

  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script>
  /* Invitación cerrada: la vaquita mensajera del juego, ahora en los huesitos. No hay nada que iniciar. */
  (function () {
    const { W, H, GROUND, COW, WING_UP, WING_DN, ENVELOPE, scenes, R } = KI.sprites;
    const cv = document.getElementById("screen"), ctx = cv.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    // La misma vaquita del juego, pero flaquita: panza hundida, costillas y ojeras
    function skinny(src) {
      const c = document.createElement("canvas"); c.width = src.width; c.height = src.height;
      const x = c.getContext("2d"); x.drawImage(src, 0, 0);
      x.clearRect(3, 9, 8, 1); x.clearRect(4, 8, 6, 1);
      x.fillStyle = "#d8d0e0"; [3, 4, 9, 10].forEach((i) => x.fillRect(i, 8, 1, 1));
      x.fillStyle = "#b9adc9"; [8, 10, 12].forEach((i) => x.fillRect(i, 5, 1, 3));
      x.fillRect(2, 6, 1, 2);
      x.fillStyle = "#c9b6d6"; x.fillRect(15, 3, 1, 1); x.fillRect(18, 3, 1, 1);
      return c;
    }
    const SK = { a: skinny(COW.a), b: skinny(COW.b) };
    const BITTEN = (() => {
      const c = document.createElement("canvas"); c.width = 9; c.height = 6;
      const x = c.getContext("2d"); x.drawImage(ENVELOPE, 0, 0);
      x.clearRect(0, 0, 3, 2); x.clearRect(0, 2, 2, 1); x.clearRect(0, 3, 1, 1);
      return c;
    })();

    const Z = 2;   // zoom de los actores sobre el escenario original
    const S = {
      t: 0, shake: 0, zzz: false, parts: [],
      cow: { x: 16, tx: 16, alt: 0, vy: 0, dir: 1, walk: false, flap: 0, rise: null, hang: false, fall: false, sit: false, tremble: false, dizzy: false, nom: false },
      env: { x: 46, y: GROUND - 6, held: false, bitten: false, show: true, vy: 0, vx: 0, fly: false },
    };

    function bubble(txt, x, y, ms = 1600) {
      const b = document.createElement("div");
      b.className = "bubble"; b.textContent = txt;
      b.style.left = Math.max(24, Math.min(76, (x * Z / W) * 100)) + "%";      // los actores van al doble de tamaño
      b.style.top = ((GROUND - (GROUND - y) * Z) / H) * 100 + "%";
      document.getElementById("bubbles").appendChild(b);
      setTimeout(() => b.remove(), ms);
    }
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const until = (fn) => new Promise((r) => { const k = () => (fn() ? r() : requestAnimationFrame(k)); k(); });
    const puff = (x, y, n, color, up) => { for (let i = 0; i < n; i++) S.parts.push({ x, y, vx: (Math.random() - 0.5) * 40, vy: up ? -10 - Math.random() * 20 : -Math.random() * 14, life: 0.5 + Math.random() * 0.4, color }); };

    async function walkTo(x) {
      const c = S.cow; c.dir = x < c.x ? -1 : 1; c.tx = x; c.walk = true;
      await until(() => Math.abs(c.x - x) < 0.6);
      c.x = x; c.walk = false;
    }

    async function story() {
      const c = S.cow, e = S.env;
      await wait(900);
      for (;;) {
        // 1. ve la carta y va por ella
        bubble("¡Correo! 💌", c.x + 12, GROUND - 22); await wait(1300);
        await walkTo(e.x - 20); c.dir = 1;
        e.held = true; await wait(400);
        // 2. intenta despegar
        bubble("Uno… dos…", c.x + 12, GROUND - 22, 1100); c.flap = 1; await wait(1200);
        c.flap = 2; c.rise = 13; bubble("¡MUUU! 😤", c.x + 12, GROUND - 34, 1200);
        await until(() => c.alt > 12);
        await wait(500);
        c.flap = 0; c.rise = null; c.hang = true; bubble("…ay.", c.x + 12, GROUND - 36, 700);
        await wait(650);
        c.hang = false; c.fall = true;
        await until(() => c.alt <= 0);
        c.fall = false; c.alt = 0; S.shake = 0.35; puff(c.x + 10, GROUND, 14, "#cfc6e6");
        e.held = false; e.fly = true; e.x = c.x + 19; e.y = GROUND - 12; e.vx = 20; e.vy = -70;
        c.sit = true; c.dizzy = true; bubble("¡Pum! 💫", c.x + 12, GROUND - 20, 1200);
        await until(() => !e.fly); await wait(1100);
        // 3. le ruge la panza
        c.dizzy = false; c.tremble = true; bubble("GRRRR… 🍽️", c.x + 8, GROUND - 16, 1500); await wait(1600);
        c.tremble = false; await wait(300);
        c.sit = false; bubble("👀", c.x + 16, GROUND - 22, 1000); await wait(1100);
        // 4. se merienda la carta
        await walkTo(e.x - 20); c.dir = 1; await wait(350);
        c.nom = true; bubble("ñam", c.x + 20, GROUND - 20, 700); await wait(450);
        e.bitten = true; puff(e.x + 1, e.y + 1, 6, "#fff6e8", true); await wait(500);
        bubble("ñam ñam", c.x + 20, GROUND - 20, 800); await wait(900); c.nom = false;
        bubble("¿Qué? Tenía hambre. 🙄", c.x + 10, GROUND - 22, 2000); await wait(2300);
        // 5. siesta y a intentarlo otra vez
        c.sit = true; S.zzz = true; await wait(3200); S.zzz = false; c.sit = false;
        await walkTo(16); c.dir = 1;
        e.show = false; await wait(300);
        e.x = 46; e.y = GROUND - 6; e.bitten = false; e.show = true; puff(e.x + 4, e.y + 2, 8, "#ffd36b", true);
        await wait(1200);
      }
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; S.t += dt;
      const c = S.cow, e = S.env;
      if (c.walk) c.x += Math.sign(c.tx - c.x) * Math.min(Math.abs(c.tx - c.x), 16 * dt);
      if (c.rise != null) c.alt += (c.rise + 0.6 - c.alt) * Math.min(1, dt * 2.2);
      if (c.fall) { c.vy += 260 * dt; c.alt -= c.vy * dt; } else c.vy = 0;
      if (e.fly) {
        e.vy += 220 * dt; e.x += e.vx * dt; e.y += e.vy * dt;
        if (e.y >= GROUND - 6) { e.y = GROUND - 6; e.fly = false; puff(e.x + 4, GROUND, 4, "#cfc6e6"); }
      }
      if (S.shake > 0) S.shake -= dt;
      S.parts = S.parts.filter((p) => (p.life -= dt) > 0);
      S.parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; });

      ctx.save();
      if (S.shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 4), Math.round((Math.random() - 0.5) * 3));
      ctx.imageSmoothingEnabled = false;
      scenes.noche(ctx, S.t, S);
      ctx.translate(0, GROUND); ctx.scale(Z, Z); ctx.translate(0, -GROUND);
      // plato vacío de la mensajera
      R(ctx, 1, GROUND - 3, 12, 1, "#2b2233"); R(ctx, 2, GROUND - 2, 10, 2, "#b9adc9"); R(ctx, 3, GROUND, 8, 1, "#2b2233");
      if (Math.sin(S.t * 3) > 0.95) R(ctx, 4, GROUND - 2, 2, 1, "#ffffff");

      if (e.show && !e.held) ctx.drawImage(e.bitten ? BITTEN : ENVELOPE, Math.round(e.x), Math.round(e.y));

      // vaquita
      const step = Math.floor(S.t * 6) % 2;
      const spr = c.walk && step ? SK.b : SK.a;
      const wob = c.flap === 2 || c.hang ? Math.round(Math.sin(S.t * 30)) : 0;
      const tr = c.tremble ? Math.floor(S.t * 24) % 2 : 0;
      const breath = !c.walk && !c.alt && !c.flap && Math.sin(S.t * 2.2) > 0.3 ? 1 : 0;
      const cx = Math.round(c.x) + wob + tr;
      const cy = GROUND - 12 - Math.round(Math.max(0, c.alt)) - (c.walk ? step : 0) + (c.sit ? 2 : 0);
      ctx.save();
      if (c.dir < 0) { ctx.translate(2 * cx + 20, 0); ctx.scale(-1, 1); }
      if (c.sit) {                                   // echada: sin patas
        ctx.drawImage(spr, 0, 0, 20, 10, cx, cy, 20, 10);
        R(ctx, cx + 1, cy + 10, 12, 1, "#2b2233");
      } else {                                       // de pie: el lomo sube y baja al respirar
        ctx.drawImage(spr, 0, 0, 14, 10 - breath, cx, cy + breath, 14, 10 - breath);
        ctx.drawImage(spr, 14, 0, 6, 10, cx + 14, cy, 6, 10);
        ctx.drawImage(spr, 0, 10, 20, 2, cx, cy + 10, 20, 2);
      }
      // ojos cerrados: parpadeo y siesta
      if (S.zzz || S.t % 3.4 < 0.14) { R(ctx, cx + 15, cy + 2, 1, 1, "#ffffff"); R(ctx, cx + 18, cy + 2, 1, 1, "#ffffff"); R(ctx, cx + 15, cy + 3, 1, 1, "#2b2233"); R(ctx, cx + 18, cy + 3, 1, 1, "#2b2233"); }
      if (c.nom && step) R(ctx, cx + 15, cy + 8, 4, 1, "#b5566a");
      // alitas (las mismas del juego, pero ya no dan para más)
      if (c.flap || c.hang || c.fall) {
        const up = c.hang ? 0 : c.fall ? 1 : Math.floor(S.t * (c.flap === 2 ? 14 : 5)) % 2;
        ctx.drawImage(up ? WING_UP : WING_DN, cx + 4, cy - 4 + (c.hang ? 2 : 0));
      }
      if (e.held) ctx.drawImage(ENVELOPE, cx + 19, cy + 6);
      ctx.restore();

      if (c.flap === 2 && Math.random() < 0.25) S.parts.push({ x: c.x + 14 + Math.random() * 6, y: cy, vx: (Math.random() - 0.5) * 30, vy: -20, life: 0.5, color: "#8fd3ff" });
      if (c.dizzy) for (let i = 0; i < 3; i++) { const a = S.t * 6 + i * 2.1; R(ctx, cx + 16 + Math.cos(a) * 5, cy - 3 + Math.sin(a) * 1.5, 1, 1, "#ffd36b"); }
      if (c.tremble) for (let i = 0; i < 3; i++) R(ctx, cx + 3 + i * 3, cy + 12 + ((Math.floor(S.t * 10) + i) % 2), 2, 1, "#ffd36b");
      if (S.zzz) {
        const k = (S.t * 0.7) % 1;
        ctx.fillStyle = "rgba(255,246,201," + (1 - k) + ")"; ctx.font = '5px "Press Start 2P", monospace';
        ctx.fillText("z", cx + 20 + k * 4, cy - 1 - k * 8); ctx.fillText("z", cx + 24 + k * 5, cy - 7 - k * 8);
      }
      S.parts.forEach((p) => R(ctx, p.x, p.y, 1, 1, p.color));
      ctx.restore();
      requestAnimationFrame(frame);
    }

    // Tocar la escena solo hace mugir a la vaquita (no inicia nada)
    const quejas = ["Muu… 🥺", "¿Traes pasto? 🌱", "Muu… ¿pizza? 🍕"];
    let q = 0;
    document.getElementById("stage").addEventListener("click", () => {
      try { KI.audio.init(); KI.audio.sfx.moo(0.8); } catch (_) {}
      bubble(quejas[q++ % quejas.length], S.cow.x + 12, GROUND - 26 - S.cow.alt, 1200);
    });

    requestAnimationFrame(frame);
    story();
  })();
  </script>
</body>
</html>
