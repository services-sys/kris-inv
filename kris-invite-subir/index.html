<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La vaquita mensajera</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #14121f; color: #e9e2f2; }
    body { display: grid; place-items: center; padding: 16px; font-family: "VT323", monospace; }
    main { width: 100%; max-width: 560px; display: grid; gap: 14px; }
    canvas { width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; border: 4px solid #3a3352; background: #2b2540; display: block; }
    .box { background: #f3ead8; color: #2a2238; border: 4px solid #3a3352; padding: 14px 16px; }
    h1 { font-family: "Press Start 2P", monospace; font-size: 13px; line-height: 1.6; margin: 0 0 8px; color: #8a3b5a; }
    p { font-size: 22px; line-height: 1.15; margin: 6px 0; }
    .muted { color: #7a6a8a; font-size: 19px; }
  </style>
</head>
<body>
  <main>
    <canvas id="c" width="160" height="120" aria-label="Una vaquita flaquita y triste esperando junto a un plato vacío"></canvas>
    <section class="box">
      <p>La vaquita mensajera tiene demasiada hambre para poder llevar tu mensaje.</p>
    </section>
  </main>
  <script>
  (function () {
    const cv = document.getElementById("c"), x = cv.getContext("2d");
    const R = (c, a, b, w, h) => { x.fillStyle = c; x.fillRect(a, b, w, h); };
    // Vaquita acostada, flaca, costillas marcadas (cada carácter = 1 px)
    const P = { k: "#2a2238", w: "#efe9df", g: "#c9c0b4", s: "#1c1a24", p: "#e8a3b4", r: "#a89e92", e: "#ffffff", t: "#7fc8ff" };
    const cow = [
      "......kk..........................",
      ".....kwwk.kk......................",
      "....kwwwwkwwk.....................",
      "...kwwsswwwwwk....................",
      "..kwwswwwwwwwwkkkkkkkkkkkkkkkkk...",
      "..kwwkkwwkwwwwwwwwwwwwssswwwwwwk..",
      "..kwwwwwwwwwwwwrwrwrwrsssswwwwwwk.",
      "..kwwewkwwwwwwwwwwwwwwwssswwwwwwwk",
      "..kwwwwwwwwwwwrwrwrwrwrwwwwwwwwwk.",
      "..tkppppkwwwwwwwwwwwwwwwwwwwswwwk.",
      "..tkpkpkkwwwwwrwrwrwrwrwwwwwsswk..",
      "...kppppk.kwwwwwwwwwwwwwwwwwwwk...",
      "....kkkk...kgkkkkgkkkkkkgkkkgk....",
      "...........kkk..kkk.....kkk.kkk...",
    ];
    const stars = [[12,8],[30,20],[47,6],[66,16],[84,9],[103,22],[121,7],[142,15],[154,30],[20,34],[74,32],[112,38]];
    const circ = (c, cx, cy, r) => { x.fillStyle = c; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); };
    let t = 0;
    function draw() {
      t++;
      const c = t % 660;                       // ciclo de ~11 s
      const growl = c < 70, dream = c > 110 && c < 340, moo = c > 380 && c < 450;
      // cielo de atardecer apagado
      ["#2b2540", "#3a2f4f", "#4a3756", "#5b3f58", "#6b4a57"].forEach((k, i) => R(k, 0, i * 14, 160, 14));
      // estrellas que titilan
      stars.forEach(([sx, sy], i) => { if (Math.sin(t / 14 + i * 1.7) > -0.2) R(Math.sin(t / 9 + i) > 0.6 ? "#fff" : "#b9a9c9", sx, sy, 1, 1); });
      // nubes lentas
      [[0.05, 14, 22], [0.03, 40, 16]].forEach(([v, cy, w], i) => {
        const cx = ((t * v + i * 90) % 200) - 30;
        R("#54415f", cx, cy, w, 3); R("#54415f", cx + 4, cy - 2, w - 9, 2); R("#5f4a66", cx + 2, cy + 3, w - 5, 1);
      });
      // sol cayendo con resplandor
      circ("rgba(217,138,90," + (0.18 + 0.06 * Math.sin(t / 30)) + ")", 128, 72, 15);
      x.fillStyle = "#d98a5a"; x.beginPath(); x.arc(128, 72, 9, Math.PI, 0); x.fill();
      R("#8a6a5a", 0, 70, 160, 2);
      // pasto seco
      R("#5a5136", 0, 72, 160, 48);
      for (let i = 0; i < 160; i += 7) R("#7a6b42", i + ((i * 3) % 5), 74 + ((i * 7) % 40), 2, 1);
      // briznas secas que se mecen
      for (let i = 0; i < 9; i++) { const gx = 6 + i * 18, gy = 112 + (i % 3) * 2, sw = Math.sin(t / 25 + i) > 0 ? 1 : 0; R("#8a7a4a", gx, gy, 1, 3); R("#8a7a4a", gx + sw, gy - 2, 1, 2); }
      // cerca
      for (let i = 4; i < 70; i += 14) R("#4a3a2a", i, 58, 2, 16);
      R("#4a3a2a", 4, 62, 66, 1); R("#4a3a2a", 4, 68, 66, 1);
      // planta rodadora (pasa por detrás)
      if (c > 430) {
        const p = (c - 430) / 230, tx = 172 - p * 190, ty = 73 - Math.abs(Math.sin(p * 14)) * 5, an = -p * 22;
        x.strokeStyle = "#a08a52"; x.lineWidth = 1; x.beginPath(); x.arc(tx, ty, 4, 0, 7);
        for (let k = 0; k < 3; k++) { const q = an + k * 1.05; x.moveTo(tx - Math.cos(q) * 4, ty - Math.sin(q) * 4); x.lineTo(tx + Math.cos(q) * 4, ty + Math.sin(q) * 4); }
        x.stroke();
      }
      // vaquita: respira, tiembla cuando le ruge la panza, levanta la cabeza para mugir
      const br = Math.sin(t / 28) > 0.2 ? 1 : 0;
      const ox = 10 + (growl ? (t % 6 < 3 ? 1 : 0) : 0), oy = 80;
      const head = moo ? -2 : 0, ear = (c > 200 && c < 214) || (c > 520 && c < 530) ? 1 : 0;
      // cola
      const fl = t % 170 < 14 ? (t % 170 < 7 ? -3 : -5) : 0;
      R(P.k, ox + 68, oy + 14, 2, 2); R(P.k, ox + 70, oy + 15 + (fl ? -1 : 1), 2, 2); R(P.k, ox + 72, oy + 16 + (fl || 3), 2, 2); R(P.s, ox + 73, oy + 17 + (fl ? fl - 1 : 5), 3, 3);
      cow.forEach((row, j) => [...row].forEach((ch, i) => {
        if (!P[ch]) return;
        const isHead = i < 14 && j < 12;
        if (isHead) R(P[ch], ox + i * 2 + (j < 3 ? ear : 0), oy + j * 2 + head, 2, 2 - head * (j > 9 ? 1 : 0));
        else if (j <= 6) R(P[ch], ox + i * 2, oy + j * 2 - br, 2, 2 + br);
        else R(P[ch], ox + i * 2, oy + j * 2, 2, 2);
      }));
      // parpadeo
      if (t % 190 < 9) { R(P.w, ox + 10, oy + 10 + head, 4, 2); R(P.k, ox + 10, oy + 11 + head, 4, 1); }
      // lágrima que cae y salpica
      const lc = t % 110;
      if (lc < 46) R("#7fc8ff", ox + 4, oy + 18 + head + lc * 0.2, 2, 2);
      else if (lc < 56) { R("#7fc8ff", ox + 2 - (lc - 46) / 4, oy + 27, 1, 1); R("#7fc8ff", ox + 7 + (lc - 46) / 4, oy + 27, 1, 1); }
      // plato vacío (tiembla con el rugido)
      const px = growl && t % 8 < 4 ? 1 : 0;
      R("#2a2238", 98 + px, 100, 16, 1); R("#9a8fa8", 99 + px, 101, 14, 3); R("#2a2238", 100 + px, 104, 12, 1);
      if (Math.sin(t / 20) > 0.92) R("#fff", 102 + px, 101, 2, 1);
      // sobre con telarañas
      R("#f3ead8", 128, 92, 18, 12); R("#c9bba0", 128, 92, 18, 1);
      x.strokeStyle = "#c9bba0"; x.beginPath(); x.moveTo(128.5, 92.5); x.lineTo(137, 99); x.lineTo(145.5, 92.5); x.stroke();
      R("#c84a6a", 136, 98, 3, 3);
      x.strokeStyle = "rgba(230,230,240,.7)"; x.beginPath();
      x.moveTo(128, 86); x.lineTo(134, 92); x.moveTo(126, 90); x.lineTo(132, 92); x.moveTo(131, 87); x.lineTo(131, 92); x.stroke();
      // arañita que sube y baja
      const sp = 4 + Math.sin(t / 40) * 4; R("rgba(230,230,240,.7)", 150, 92, 1, sp); R("#1c1a24", 149, 92 + sp, 3, 2);
      // moscas en ochos
      for (let f = 0; f < 3; f++) {
        const a = t / 8 + f * 2.1;
        R("#111", ox + 40 + Math.sin(a) * (9 + f * 3) | 0, oy - 4 + Math.sin(a * 2) * 4 | 0, 1, 1);
      }
      x.textBaseline = "alphabetic";
      // rugido de tripas
      if (growl) {
        x.font = '6px "Press Start 2P", monospace'; x.fillStyle = "#ffd98a";
        x.fillText("grr" + (c > 25 ? "r" : "") + (c > 45 ? "…" : ""), ox + 34 + (t % 4 < 2 ? 1 : 0), oy - 6 - (t % 6 < 3 ? 1 : 0));
        for (let k = 0; k < 3; k++) R("#ffd98a", ox + 36 + k * 6, oy + 2 + ((t >> 2) + k) % 2, 3, 1);
      }
      // sueña con pasto fresco
      if (dream) {
        const k = Math.min(1, (c - 110) / 25), end = c > 310;
        circ("#f3ead8", 38, 76, 1.5); if (k > 0.4) circ("#f3ead8", 43, 70, 2.5);
        if (k > 0.8 && !(end && t % 6 < 3)) {
          const by = 52 + Math.sin(t / 22) * 1.5;
          x.fillStyle = "#f3ead8"; x.beginPath(); x.ellipse(62, by, 17, 12, 0, 0, 7); x.fill();
          R("#4c9a3a", 50, by + 5, 24, 2);
          for (let g = 0; g < 8; g++) { const h = 4 + (g * 5) % 6, sw = Math.sin(t / 12 + g) > 0 ? 1 : 0; R(g % 2 ? "#5cb84a" : "#3f8a30", 51 + g * 3, by + 5 - h, 2, h); R("#7fd66a", 51 + g * 3 + sw, by + 4 - h, 1, 2); }
          R("#ffd1df", 58, by - 5, 2, 2); R("#ffe98a", 68, by - 3, 2, 2);
        }
      }
      // mugido débil
      if (moo) {
        x.font = '6px "Press Start 2P", monospace';
        x.fillStyle = "rgba(240,230,250," + (1 - (c - 380) / 70) + ")";
        x.fillText("mu" + (c > 400 ? "u" : "") + (c > 420 ? "…" : ""), ox + 2, oy - 6 - (c - 380) / 8);
      }
      requestAnimationFrame(draw);
    }
    draw();
  })();
  </script>
</body>
</html>
